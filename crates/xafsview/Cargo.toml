[package]
name = "xafsview"
version = "0.2.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
# Overrides the workspace MSRV (1.89): the GUI stack (rsplot/egui/eframe/wgpu)
# requires 1.95. The library crates keep 1.89; only this binary needs the newer
# toolchain.
rust-version = "1.95"
description = "XAFSView — a modern Rust GUI for XAFS data reduction and FEFF fitting, built on feffit-rs + rsplot"
default-run = "xafsview"

[[bin]]
name = "xafsview"
path = "src/main.rs"

[dependencies]
# The whole engine, now one crate: the data session model (xasdata), the Feff
# path files (feffdat), the global parameter/expression system (params), the
# FEFFIT fit driver, and the Atoms/Feff input + run support (feffinp/feffrun).
# `spacegroup` pulls in pure-Rust space-group symmetry expansion for the Atoms
# tab; the in-process FEFF10 backend (`feff10`) is on by feffit's default.
feffit = { path = "../feffit", version = "0.1.1", features = ["spacegroup"] }

# GUI stack. Pinned to 0.36 to match rsplot's egui/egui-wgpu pins; the wgpu
# renderer is required (Plot1D paints through an egui-wgpu callback).
# `default-features = false` drops eframe's glow/accesskit defaults, but it also
# drops `x11` + `wayland` — and those gate winit's Linux windowing backends. So
# they must be re-enabled explicitly, or winit finds no platform backend on Linux
# ("unresolved import self::platform") and the build fails. On macOS/Windows the
# winit x11/wayland code is cfg-gated to free-unix, so these are inert there.
eframe = { version = "0.36", default-features = false, features = [
    "wgpu",
    "default_fonts",
    "x11",
    "wayland",
    # Settings/window persistence across runs (Prefs in app.rs): enables
    # `cc.storage` + `App::save` and the automatic window-geometry restore.
    "persistence",
] }
egui = "0.36"
rsplot = "0.6.1"
# Native file/folder dialogs (Folders tab, Open/Save). Matches rsplot's rfd pin.
rfd = "0.17"

# Morlet continuous wavelet transform of chi(k) (the EXAFS wavelet view). Pure
# Rust: the default backend is rustfft; the C FFTW backend is an opt-in feature
# we do not enable.
fcwt = "0.1.3"

# Atomic / X-ray data for the Phase-8 calculators (periodic table, atom data,
# ion-chamber/gas absorption, powder weight) and Chantler f2 for MBACK norm.
xraydb = { workspace = true }

# Run the per-group Feffit batch fits in parallel (each fit is independent).
rayon = { workspace = true }

# The GUI-embedded MCP server (see src/mcp.rs): rmcp provides the protocol +
# streamable-HTTP session layer as a plain `tower` service, so the HTTP stack
# is ours — hyper serves it on a tokio runtime in a background thread.
rmcp = { version = "3.5.1", features = ["transport-streamable-http-server", "transport-worker"] }
tokio = { version = "1.53.3", features = ["rt-multi-thread", "sync", "macros", "net", "time"] }
tokio-util = "0.7"
hyper = { version = "1", features = ["server", "http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
base64 = "0.23"
png = "0.18.1"

# Font-chain glyph-coverage test (src/fonts.rs): parse the vendored + egui
# default fonts' cmaps. Already in the dependency tree via epaint.
[dev-dependencies]
skrifa = "0.44"

# Embed assets/icon.ico into the .exe as its Windows Explorer/taskbar file icon
# (see build.rs). Gated to a Windows host: the resource compile needs the MSVC
# (or GNU) resource compiler, and only a Windows build emits a .exe to carry it,
# so non-Windows builds pull nothing and run no resource step.
[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"
