[workspace]
resolver = "3"
members = ["crates/feffit", "crates/xafsview"]
# The vendored eframe below is a dependency, not a member: keep it out of
# the workspace's fmt / clippy / test sweeps.
exclude = ["vendor/eframe"]

[workspace.package]
edition = "2024"
license = "MIT"
rust-version = "1.89"
repository = "https://github.com/physwkim/feffit-rs"

[workspace.dependencies]
num-complex = "0.4"
rustfft = "6"
# Data parallelism for the batch drivers (Multiple AUTOBK, batch make-μ, Feffit
# batch): each group/file/fit is independent, so a parallel iterator over them
# scales the slow reductions and fits across cores.
rayon = "1"
# Pure-Rust atomic/X-ray database (edges, lines, cross-sections, Chantler f1/f2,
# ion-chamber, materials) — mirrors Python xraydb. GUI-only (the P8 calculators).
xraydb = "0.1.2"

# eframe 0.36.2 as published, plus vendor/eframe-0.36.2-immediate-viewport-
# screenshot.patch: render_immediate_viewport dropped ViewportCommand::Screenshot,
# so the MCP screenshot tool could not capture a pop-up window (every pop-up is
# an immediate viewport). 0.37.0 and master still drop it; remove this entry
# and vendor/ once a release carries the fix.
[patch.crates-io]
eframe = { path = "vendor/eframe" }
